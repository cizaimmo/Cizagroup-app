<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Connexion — CIZA GROUP</title>
<link rel="icon" href="logotransparent.png">
<meta name="theme-color" content="#0A0A0A">

<style>
:root{
  --bg:#0A0A0A;
  --card:#141414;
  --gold:#F2B840;
  --input:#1A1A1A;
  --txt:#FAF3E3;
}
*{box-sizing:border-box}
body{
  margin:0;
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:24px 16px;
  background:
    radial-gradient(ellipse 80% 45% at 50% 0%, rgba(242,184,64,.14), transparent 70%),
    linear-gradient(180deg,#0A0A0A,#050505);
  font-family:system-ui,-apple-system,Segoe UI,Roboto;
  color:var(--txt);
}
@keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes logoGlow{0%,100%{filter:drop-shadow(0 0 0 rgba(242,184,64,0))}50%{filter:drop-shadow(0 0 22px rgba(242,184,64,.55))}}
.card{
  width:100%;
  max-width:440px;
  background:rgba(250,243,227,0.04);
  border:1px solid rgba(250,243,227,.14);
  border-radius:28px;
  padding:36px 26px 30px;
  text-align:center;
  box-shadow:0 20px 60px rgba(0,0,0,.5);
  animation:fadeUp .6s ease both;
}
.card img.logo{width:104px;margin-bottom:6px;animation:logoGlow 3s ease-in-out infinite}
.brand{
  color:var(--gold);
  font-size:22px;
  font-weight:800;
  letter-spacing:4px;
  margin:8px 0 4px;
}
.tagline{
  font-size:15px;
  opacity:.92;
  margin-bottom:16px;
  line-height:1.45;
}
.chips{
  display:flex;
  flex-wrap:wrap;
  gap:7px;
  justify-content:center;
  margin-bottom:20px;
}
.chips span{
  font-size:12px;
  font-weight:600;
  color:var(--txt);
  background:rgba(250,243,227,.06);
  border:1px solid rgba(242,184,64,.45);
  border-radius:999px;
  padding:6px 12px;
}
.value{
  font-size:13px;
  color:var(--gold);
  font-weight:600;
  margin-bottom:22px;
}
input{
  width:100%;padding:16px;margin:8px 0;border-radius:18px;border:1px solid rgba(250,243,227,.12);
  outline:none;background:var(--input);color:#FAF3E3;font-size:15px
}
input:focus{border-color:var(--gold)}
button{
  width:100%;padding:16px;margin-top:10px;border-radius:20px;border:none;
  background:linear-gradient(135deg,#F2B840,#FFD77A);
  color:#0A0A0A;font-size:17px;font-weight:700;cursor:pointer;
  transition:transform .15s ease
}
button:active{transform:scale(.97)}
button:hover{opacity:.92}
#msg{margin-top:14px;min-height:18px;font-size:14px}
.divider{
  display:flex;align-items:center;gap:12px;
  margin:20px 0 4px;
  color:rgba(250,243,227,.5);
  font-size:13px;
}
.divider::before,.divider::after{
  content:"";flex:1;height:1px;background:rgba(250,243,227,.14);
}
.btn-outline{
  display:block;
  width:100%;
  padding:15px;
  margin-top:14px;
  border-radius:20px;
  border:1.5px solid var(--gold);
  background:transparent;
  color:var(--gold);
  font-size:16px;
  font-weight:700;
  text-decoration:none;
  transition:transform .15s ease;
}
.btn-outline:active{transform:scale(.97)}
.forgot{
  display:inline-block;
  margin-top:16px;
  font-size:14px;
  color:var(--gold);
  text-decoration:none;
  font-weight:600;
}
.forgot:hover{text-decoration:underline}
.support{margin-top:22px;font-size:13px;opacity:.9}
.support span{color:var(--gold);font-weight:700}
</style>
</head>

<body>

<div class="card">
  <img class="logo" src="logotransparent.png" alt="CIZA GROUP">
  <div class="brand">CIZA GROUP</div>
  <div class="tagline">L'écosystème qui connecte l'Afrique au monde.</div>

  <div class="chips">
    <span>📦 CIZA SUPPLY</span>
    <span>🛍️ CizaShop</span>
    <span>🏠 CizaImmo</span>
    <span>🚘 CizaRide+</span>
    <span>🚿 CarWash+</span>
    <span>🌍 Diaspora</span>
  </div>

  <div class="value">Un seul compte pour tous les services.</div>

  <input id="email" type="email" placeholder="Adresse email">
  <input id="password" type="password" placeholder="Mot de passe">

  <button onclick="login()">Se connecter</button>
  <div id="msg"></div>

  <div class="divider">ou</div>

  <a class="btn-outline" href="signup.html">Créer un compte</a>

  <a class="forgot" href="reset-password.html">Mot de passe oublié ?</a>

  <div class="support">
    Besoin d'aide ?<br>
    📱 <span>WhatsApp Canada : +1 514 502 9503</span>
  </div>
</div>

<!-- FIREBASE AUTH + FIRESTORE -->
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.7.0/firebase-app.js";
import { getAuth, signInWithEmailAndPassword, signOut } from "https://www.gstatic.com/firebasejs/12.7.0/firebase-auth.js";
import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/12.7.0/firebase-firestore.js";

/* CONFIG FIREBASE */
const firebaseConfig = {
  apiKey: "AIzaSyBAiJHbBvRO6cDFpm6C-5mQk6SiTtzcI8o",
  authDomain: "cizagroup-app.firebaseapp.com",
  projectId: "cizagroup-app",
  appId: "1:930936264084:web:5395360e54bf17bf492b81"
};

const app  = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db   = getFirestore(app);

/* IMPORTANT : fonction globale pour onclick */
window.login = async function () {
  const email = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value.trim();
  const msg = document.getElementById("msg");

  msg.innerText = "";

  if(!email || !password){
    msg.innerText = "Veuillez remplir tous les champs";
    return;
  }

  msg.innerText = "Connexion en cours...";

  try{
    // 1) Auth
    const cred = await signInWithEmailAndPassword(auth, email, password);
    const uid  = cred.user.uid;

    // 2) Profil Firestore
    const snap = await getDoc(doc(db, "users", uid));
    if(!snap.exists()){
      msg.innerText = "Profil utilisateur introuvable";
      await signOut(auth);
      return;
    }

    const data = snap.data();

    // 3) Blocage comptes supprimés
    if(data.deleted === true || data.status !== "active"){
      msg.innerText = "Ce compte a été supprimé ou désactivé.";
      await signOut(auth);
      localStorage.removeItem("ciza_user_status");
      return;
    }

    // 4) OK
    localStorage.setItem("ciza_user_status", "active");
    window.location.replace("index.html");

  }catch(e){
    msg.innerText = "Email ou mot de passe incorrect ❌";
  }
};
</script>

</body>
</html>
