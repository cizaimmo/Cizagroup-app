<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>CizaRide+ — Commander un trajet</title>
<script>
if(localStorage.getItem("ciza_user_status") !== "active"){
  window.location.replace("login.html");
}
</script>
<link rel="icon" href="logotransparent.png">

<style>*,*::before,*::after{box-sizing:border-box}
body{
    margin:0;
    background:#0A0A0A;
    color:#FAF3E3;
    font-family:Arial, sans-serif;
}
header{
    padding:20px;
    text-align:center;
    border-bottom:1px solid #12335C;
}
header img{ width:90px; }
header h2{ color:#F2B840; margin:10px 0 0; }

.container{
    max-width:420px;
    margin:40px auto;
    background:#141414;
    padding:25px;
    border-radius:14px;
    border:1px solid #12335C;
}
input{
    width:100%;
    padding:12px;
    margin-top:12px;
    border:none;
    border-radius:8px;
    background:#112544;
    color:#FAF3E3;
}
button{
    width:100%;
    padding:12px;
    margin-top:18px;
    background:#0b84ff;
    color:#FAF3E3;
    border:none;
    border-radius:8px;
    font-weight:bold;
    cursor:pointer;
}
.msg{
    margin-top:15px;
    text-align:center;
}
</style>
</head>

<body>

<header>
    <img src="logotransparent.png">
    <h2>Commander un trajet</h2>
</header>

<div class="container">
    <input type="text" id="pickup" placeholder="Lieu de départ">
    <input type="text" id="destination" placeholder="Destination">

    <button onclick="orderRide()">Commander</button>

    <div class="msg" id="msg"></div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
import { getAuth, onAuthStateChanged } 
from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
import { 
  getFirestore, collection, addDoc, serverTimestamp,
  query, where, getDocs, limit, updateDoc, doc
} from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyBAiJHbBvRO6cDFpm6C-5mQk6SiTtzcI8o",
  authDomain: "cizagroup-app.firebaseapp.com",
  projectId: "cizagroup-app"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

let currentUser = null;

onAuthStateChanged(auth, (user)=>{
    if(!user){
        window.location.href = "login.html";
    }else{
        currentUser = user;
    }
});

window.orderRide = async function(){
    const pickup = document.getElementById("pickup").value;
    const destination = document.getElementById("destination").value;
    const msg = document.getElementById("msg");

    if(!pickup || !destination){
        msg.textContent = "Veuillez remplir tous les champs.";
        return;
    }

    // 🔍 Trouver un chauffeur disponible
    const q = query(
        collection(db, "drivers"),
        where("available", "==", true),
        limit(1)
    );

    const qs = await getDocs(q);

    if(qs.empty){
        msg.textContent = "Aucun chauffeur disponible pour le moment.";
        return;
    }

    const driverDoc = qs.docs[0];
    const driverId = driverDoc.id;

    // 🚗 Créer la course
    const rideRef = await addDoc(collection(db, "rides"), {
        clientId: currentUser.uid,
        driverId: driverId,
        pickup,
        destination,
        status: "assigned",
        createdAt: serverTimestamp()
    });

    // 🔒 Marquer le chauffeur comme indisponible
    await updateDoc(doc(db, "drivers", driverId), {
        available: false
    });

    msg.textContent = "🚗 Chauffeur assigné, trajet en cours !";
    msg.style.color = "#4ade80";

    setTimeout(()=>{
        window.location.href = "dashboard.html";
    },1500);
};
</script>

</body>
</html>
